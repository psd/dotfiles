# foot config used by ~/.local/bin/foot: normal config, plus a dark palette
# ([colors-dark]) and the current theme's palette ([colors-light]).
# psd-workspace-theme switches between them with SIGUSR1/SIGUSR2.
[main]
include=~/.config/foot/foot.ini
include=/home/psd/.config/omarchy/workspace-dark/foot.ini
include=/home/psd/.config/omarchy/workspace-dark/foot-light.ini
